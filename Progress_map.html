<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>North Sea Monitoring Progress Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #map { height: 100vh; }
</style>
</head>
<body>

<div id="map"></div>

<script>
// ------------------------------------------------------------
// 1. CONFIGURATION
// ------------------------------------------------------------

// Your SharePoint CSV link:
const csvUrl =  "https://docs.google.com/spreadsheets/d/1RGcPPXybYzVNQCwyK2_uOaodrWjwalecxCsRLqBiuE8/export?format=csv";
   
// Map center (North Sea)
const map = L.map('map').setView([56.5, 3.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 12,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Marker color logic
function statusColor(status) {
  switch (status.toLowerCase()) {
    case "done": return "green";
    case "in progress": return "orange";
    case "skipped": return "red";
    case "pending": return "gray";
    default: return "gray";
  }
}

// ------------------------------------------------------------
// 2. LOAD CSV FROM SHAREPOINT
// ------------------------------------------------------------
async function loadStations() {
  try {
    const response = await fetch(csvUrl + "&_=" + Date.now());
    const text = await response.text();

    const rows = text.trim().split("\n").map(r => r.split(","));
    const header = rows[0];
    const data = rows.slice(1);

    // Remove old markers
    map.eachLayer(layer => {
      if (layer instanceof L.CircleMarker) map.removeLayer(layer);
    });

    // Add markers
  data.forEach(row => {
  const station = row[0].trim();
  const lat = parseFloat(row[1]);
  const lon = parseFloat(row[2]);
  const method = row[3].trim();
  const status = row[4].trim();

  if (!lat || !lon) return;

  const color = statusColor(status);

 let marker;

if (method.toLowerCase() === "gov") {
  // Circle (default)
  marker = L.circleMarker([lat, lon], {
    radius: 5,
    color: color,
    fillColor: color,
    fillOpacity: 0.1
  });

} else if (method.toLowerCase() === "jst") {
  // Square (using divIcon)
  marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="
        width:14px;
        height:14px;
        background:${color};
        border:2px solid ${color};
        transform: rotate(0deg);
      "></div>`
    })
  });

} else {
  // Triangle (fallback)
  marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 14px solid ${color};
      "></div>`
    })
  });
}

marker.addTo(map);

  marker.bindPopup(
    `<b>Station:</b> ${station}<br>
     <b>Method:</b> ${method}<br>
     <b>Status:</b> ${status}<br>
     <b>Lon:</b> ${lon}<br>
     <b>Lat:</b> ${lat}<br>`
  );
});

  } catch (err) {
    console.error("Error loading CSV:", err);
  }
}

 
function drawICESGrid() {
  const latStart = 48;
  const latEnd = 62;
  const lonStart = -4;
  const lonEnd = 12;

  for (let lat = latStart; lat < latEnd; lat += 0.5) {
    for (let lon = lonStart; lon < lonEnd; lon += 1) {

      const bounds = [
        [lat, lon],
        [lat + 0.5, lon + 1]
      ];

      L.rectangle(bounds, {
        color: "#888",
        weight: 0.5,
        fill: false
      }).addTo(map);
    }
  }
}

drawICESGrid();
 
  
  
// Initial load
loadStations();

// Auto-refresh every 20 seconds
setInterval(loadStations, 20000);
</script>

</body>
</html>
