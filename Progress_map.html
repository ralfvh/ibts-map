<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>North Sea Monitoring Progress Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #map { height: 100vh; }

  
.filter-box {
  background: white;
  padding: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

</style>
</head>
<body>

<div id="map"></div>

<script>
// ------------------------------------------------------------
// 1. CONFIGURATION
// ------------------------------------------------------------


let activeCountries = {
  fr: true,
  nl: true,
  dk: true,
  ge: true,
  no: true,
  sc: true,
  sw: true
};

  
// Your SharePoint CSV link:
const csvUrl =  "https://docs.google.com/spreadsheets/d/1RGcPPXybYzVNQCwyK2_uOaodrWjwalecxCsRLqBiuE8/export?format=csv";
   
// Map center (North Sea)
const map = L.map('map').setView([56.5, 3.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 12,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const stationLayer = L.layerGroup().addTo(map);

// Marker color logic
function statusColor(status) {
  switch (status.toLowerCase()) {
    case "done": return "green";
    case "in progress": return "orange";
    case "skipped": return "red";
    case "pending": return "gray";
    default: return "gray";
  }
}

// ------------------------------------------------------------
// 2. LOAD CSV FROM SHAREPOINT
// ------------------------------------------------------------
async function loadStations() {
  stationLayer.clearLayers()
  try {
    const response = await fetch(csvUrl + "&_=" + Date.now());
    const text = await response.text();

    const rows = text.trim().split("\n").map(r => r.split(","));
    const header = rows[0];
    const data = rows.slice(1);

     // Add markers
  data.forEach(row => {
  const station = row[0].trim();
  const lat = parseFloat(row[1]);
  const lon = parseFloat(row[2]);
  const method = row[3].trim();
  const status = row[4].trim();
  const country = row[5].trim();
   
  const countryLower = country.toLowerCase();
  // Filter out unchecked methods
  if (!activeCountries[countryLower]) return;
    
  if (!lat || !lon) return;

  const color = statusColor(status);

 let marker;

if (method.toLowerCase() === "gov") {
  // Circle (default)
  marker = L.circleMarker([lat, lon], {
    radius: 5,
    color: color,
    fillColor: color,
    fillOpacity: 0.4
  });

} else if (method.toLowerCase() === "jst") {
  // Square (using divIcon)
  marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="
        width:12px;
        height:12px;
        background:${color};
        border:2px solid ${color};
        transform: rotate(0deg);
      "></div>`
    })
  });

} else {
  // Triangle (fallback)
  marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 14px solid ${color};
      "></div>`
    })
  });
}

marker.addTo(stationLayer);

  marker.bindPopup(
    `<b>Station:</b> ${station}<br>
     <b>Method:</b> ${method}<br>
     <b>Status:</b> ${status}<br>
     <b>Lon:</b> ${lon}<br>
     <b>Lat:</b> ${lat}<br>`
  );
});

  } catch (err) {
    console.error("Error loading CSV:", err);
  }
}

const filterControl = L.control({ position: "bottomright" });

filterControl.onAdd = function () {
  const div = L.DomUtil.create("div", "filter-box");

  div.innerHTML = `
    <b>Country filter</b><br>
    <label>
      <input type="checkbox" id="filter-fr" checked> fr
    </label><br>
      <label>
      <input type="checkbox" id="filter-ge" checked> ge
    </label><br>
      <label>
      <input type="checkbox" id="filter-dk" checked> dk 
    </label><br>
      <label>
      <input type="checkbox" id="filter-sw" checked> sw
    </label><br>
      <label>
      <input type="checkbox" id="filter-no" checked> no
    </label><br>
      <label>
      <input type="checkbox" id="filter-sc" checked> sc
    </label><br>
    <label>
      <input type="checkbox" id="filter-nl" checked> nl
    </label>
  `;

  return div;
};

filterControl.addTo(map);
  
 
function drawICESGrid() {
  const latStart = 48;
  const latEnd = 62;
  const lonStart = -4;
  const lonEnd = 12;

  for (let lat = latStart; lat < latEnd; lat += 0.5) {
    for (let lon = lonStart; lon < lonEnd; lon += 1) {

      const bounds = [
        [lat, lon],
        [lat + 0.5, lon + 1]
      ];

      L.rectangle(bounds, {
        color: "#888",
        weight: 0.5,
        fill: false
      }).addTo(map);
    }
  }
}

drawICESGrid();
 
  
  
// Initial load
loadStations();

  
document.addEventListener("change", function (e) {

  if (e.target.id === "filter-fr") {
    activeCountries.fr = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-nl") {
    activeCountries.nl = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-dk") {
    activeCountries.dk = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-sc") {
    activeCountries.sc = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-no") {
    activeCountries.no = e.target.checked;
    loadStations();
  }
  
  if (e.target.id === "filter-sw") {
    activeCountries.sw = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-ge") {
    activeCountries.ge = e.target.checked;
    loadStations();
  }
  
});

function startAISStream() {
  const TRIDENS_MMSI = "244033000";
  const SCOTIA_MMSI = "234973000";

  const socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

  socket.onopen = () => {
    console.log("AISstream connected");

    const subscriptionMessage = {
      APIKey: "d50b5a4d186f9c7fda0a611b197f9840c368347c",
      BoundingBoxes: [[[48, -5], [62, 12]]],
      FiltersShipMMSI: ["244033000"]
    };

    socket.send(JSON.stringify(subscriptionMessage));
  };

  socket.onmessage = async (event) => {
    try {
      let text;

      // Handle Blob vs string
      if (typeof event.data === "string") {
        text = event.data;
      } else {
        text = await event.data.text();
      }

      const msg = JSON.parse(text);

      console.log("AIS RAW:", msg);

      // Safely extract message
      if (!msg || !msg.Message) return;

      const p =
        msg.Message.PositionReport ||
        msg.Message.ExtendedClassBPositionReport ||
        msg.Message.StandardClassBPositionReport;

      if (!p) return;

      const lat = p.Latitude;
      const lon = p.Longitude;
      const sog = p.Sog;
      const cog = p.Cog;

      if (lat == null || lon == null) return;

      console.log("AIS POSITION:", lat, lon);

      // Create storage for vessels
if (!window.vesselMarkers) {
  window.vesselMarkers = {};
}

// Identify vessel
const mmsi = msg.MetaData?.MMSI;

// Choose icon per vessel
let iconUrl = "https://upload.wikimedia.org/wikipedia/commons/5/5c/Ship_font_awesome.svg";

if (mmsi === 244033000) {
  iconUrl = "https://maps.gstatic.com/mapfiles/ms2/micons/blue.png";   // Tridens
}
if (mmsi === 234973000) {
  iconUrl = "https://maps.gstatic.com/mapfiles/ms2/micons/red.png";    // Scotia
}

// Remove old marker for THIS vessel only
if (window.vesselMarkers[mmsi]) {
  map.removeLayer(window.vesselMarkers[mmsi]);
}

// Add new marker
window.vesselMarkers[mmsi] = L.marker([lat, lon], {
  icon: L.icon({
    iconUrl: iconUrl,
    iconSize: [32, 32]
  })
}).addTo(map);

// Label based on MMSI
let vesselName = "Unknown vessel";
if (mmsi === 244033000) vesselName = "RV Tridens";
if (mmsi === 234973000) vesselName = "RV Scotia";

// Popup
window.vesselMarkers[mmsi].bindPopup(`
  <b>${vesselName} (Live AIS)</b><br>
  MMSI: ${mmsi}<br>
  Lat: ${lat}<br>
  Lon: ${lon}<br>
  Speed: ${sog ?? "n/a"} kn<br>
  Course: ${cog ?? "n/a"}°
`);

   } catch (err) {
      console.error("AIS parse error:", err);
    }
  };

  socket.onerror = (err) => {
    console.error("AISstream error:", err);
  };

  socket.onclose = () => {
    console.warn("AIS connection closed");
  };
}

startAISStream();

// Auto-refresh every 30 seconds
setInterval(loadStations, 30000);
</script>

</body>
</html>
