<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>North Sea Monitoring Progress Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #map { height: 100vh; }

  
.filter-box {
  background: white;
  padding: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

</style>
</head>
<body>

<div id="map"></div>

<script>
// ------------------------------------------------------------
// 1. CONFIGURATION
// ------------------------------------------------------------


let activeCountries = {
  fr: true,
  nl: true,
  dk: true,
  ge: true,
  no: true,
  sc: true,
  sw: true
};

  
// Your SharePoint CSV link:
const csvUrl =  "https://docs.google.com/spreadsheets/d/1RGcPPXybYzVNQCwyK2_uOaodrWjwalecxCsRLqBiuE8/export?format=csv";
   
// Map center (North Sea)
const map = L.map('map').setView([56.5, 3.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 12,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const stationLayer = L.layerGroup().addTo(map);

// Marker color logic
function statusColor(status) {
  switch (status.toLowerCase()) {
    case "done": return "green";
    case "in progress": return "orange";
    case "skipped": return "red";
    case "pending": return "gray";
    default: return "gray";
  }
}

function createBoatIcon(color) {
  return L.divIcon({
    className: "",
    html: `
      <div style="
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 16px solid ${color};
        transform: rotate(0deg);
      "></div>
    `,
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
}
  
window.vesselTracks = {};

// ------------------------------------------------------------
// 2. LOAD CSV FROM SHAREPOINT
// ------------------------------------------------------------
async function loadStations() {
  stationLayer.clearLayers()
  try {
    const response = await fetch(csvUrl + "&_=" + Date.now());
    const text = await response.text();

    const rows = text.trim().split("\n").map(r => r.split(","));
    const header = rows[0];
    const data = rows.slice(1);

     // Add markers
  data.forEach(row => {
  const station = row[0].trim();
  const lat = parseFloat(row[1]);
  const lon = parseFloat(row[2]);
  const method = row[3].trim();
  const status = row[4].trim();
  const country = row[5].trim();
  const lat1= row[8].trim();
  const lon1= row[9].trim();
   
  const countryLower = country.toLowerCase();
  // Filter out unchecked methods
  if (!activeCountries[countryLower]) return;
    
  if (!lat || !lon) return;

  const color = statusColor(status);

 let marker;

if (method.toLowerCase() === "gov") {
  // Circle (default)
  marker = L.circleMarker([lat, lon], {
    radius: 5,
    color: color,
    fillColor: color,
    fillOpacity: 0.4
  });

} else if (method.toLowerCase() === "jst") {
  // Square (using divIcon)
  marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="
        width:12px;
        height:12px;
        background:${color};
        border:2px solid ${color};
        transform: rotate(0deg);
      "></div>`
    })
  });

} else {
  // Triangle (fallback)
  marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 14px solid ${color};
      "></div>`
    })
  });
}

marker.addTo(stationLayer);

  marker.bindPopup(
    `<b>Station:</b> ${station}<br>
     <b>Method:</b> ${method}<br>
     <b>Status:</b> ${status}<br>
     <b>Lon:</b> ${lon}, ${lon1}<br>
     <b>Lat:</b> ${lat}, ${lat1}<br>`
  );
});

  } catch (err) {
    console.error("Error loading CSV:", err);
  }
}

const filterControl = L.control({ position: "bottomright" });

filterControl.onAdd = function () {
  const div = L.DomUtil.create("div", "filter-box");

  div.innerHTML = `
    <b>Country filter</b><br>
    <label>
      <input type="checkbox" id="filter-fr" checked> fr
    </label><br>
      <label>
      <input type="checkbox" id="filter-ge" checked> ge
    </label><br>
      <label>
      <input type="checkbox" id="filter-dk" checked> dk 
    </label><br>
      <label>
      <input type="checkbox" id="filter-sw" checked> sw
    </label><br>
      <label>
      <input type="checkbox" id="filter-no" checked> no
    </label><br>
      <label>
      <input type="checkbox" id="filter-sc" checked> sc
    </label><br>
    <label>
      <input type="checkbox" id="filter-nl" checked> nl
    </label>
  `;

  return div;
};

filterControl.addTo(map);
  
function drawICESGrid() {
  const latStart = 48;
  const latEnd = 62;
  const lonStart = -4;
  const lonEnd = 12;

  for (let lat = latStart; lat < latEnd; lat += 0.5) {
    for (let lon = lonStart; lon < lonEnd; lon += 1) {

      const bounds = [
        [lat, lon],
        [lat + 0.5, lon + 1]
      ];

      L.rectangle(bounds, {
        color: "#888",
        weight: 0.5,
        fill: false
      }).addTo(map);
    }
  }
}

drawICESGrid();
 
  
  
// Initial load
loadStations();

  
document.addEventListener("change", function (e) {

  if (e.target.id === "filter-fr") {
    activeCountries.fr = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-nl") {
    activeCountries.nl = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-dk") {
    activeCountries.dk = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-sc") {
    activeCountries.sc = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-no") {
    activeCountries.no = e.target.checked;
    loadStations();
  }
  
  if (e.target.id === "filter-sw") {
    activeCountries.sw = e.target.checked;
    loadStations();
  }

  if (e.target.id === "filter-ge") {
    activeCountries.ge = e.target.checked;
    loadStations();
  }
  
});

function startAISStream() {
  const VESSELS = {
  244033000: { name: "RV Tridens", color: "blue" },
  234973000: { name: "RV Scotia", color: "red" },
  265009000: { name: "RV Svea", color: "green" },
  227297000: { name: "RV Thalassa", color: "purple" },
  219384000: { name: "RV Dana", color: "orange" },
  211215500: { name: "RV Walther Herwig", color: "black" },
  257105000: { name: "G.O. Sars", color: "brown" }
};

  const vesselControl = L.control({ position: "topright" });

vesselControl.onAdd = function () {
  const div = L.DomUtil.create("div", "filter-box");

  div.innerHTML = "<b>Vessels</b><br>";

  Object.keys(VESSELS).forEach(mmsi => {
    div.innerHTML += `
      <label>
        <input type="checkbox" class="vessel-toggle" value="${mmsi}" checked>
        ${VESSELS[mmsi].name}
      </label><br>
    `;
  });

  return div;
};

vesselControl.addTo(map);

window.visibleVessels = {};
Object.keys(VESSELS).forEach(m => window.visibleVessels[m] = true);

document.addEventListener("change", function (e) {
  if (e.target.classList.contains("vessel-toggle")) {
    const mmsi = e.target.value;
    window.visibleVessels[mmsi] = e.target.checked;

    // Show/hide marker
    if (window.vesselMarkers[mmsi]) {
      if (e.target.checked) {
        map.addLayer(window.vesselMarkers[mmsi]);
      } else {
        map.removeLayer(window.vesselMarkers[mmsi]);
      }
    }

    // Show/hide track
    if (window.vesselTracks[mmsi]?.line) {
      if (e.target.checked) {
        map.addLayer(window.vesselTracks[mmsi].line);
      } else {
        map.removeLayer(window.vesselTracks[mmsi].line);
      }
    }
  }
});

  
  const socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

  socket.onopen = () => {
    console.log("AISstream connected");

    const subscriptionMessage = {
      APIKey: "d50b5a4d186f9c7fda0a611b197f9840c368347c",
      BoundingBoxes: [[[48, -5], [62, 19]]],
      FiltersShipMMSI: ["244033000","234973000","265009000","227297000","219384000","211215500","257105000"]
    };

    socket.send(JSON.stringify(subscriptionMessage));
  };

socket.onmessage = async (event) => {
  try {
    let text;

    if (typeof event.data === "string") {
      text = event.data;
    } else {
      text = await event.data.text();
    }

    const msg = JSON.parse(text);

    const p =
      msg.Message?.PositionReport ||
      msg.Message?.ExtendedClassBPositionReport ||
      msg.Message?.StandardClassBPositionReport;

    if (!p) return;

    const lat = p.Latitude;
    const lon = p.Longitude;
    const mmsi = msg.MetaData?.MMSI;

    if (lat == null || lon == null || !VESSELS[mmsi]) return;

    const vessel = VESSELS[mmsi];

    // Update or create marker (NO removal = smooth movement)
if (!window.vesselMarkers) {
  window.vesselMarkers = {};
}

if (!window.vesselMarkers[mmsi]) {
  window.vesselMarkers[mmsi] = L.marker([lat, lon], {
    icon: createBoatIcon(vessel.color)
  }).addTo(map);
} else {
  window.vesselMarkers[mmsi].setLatLng([lat, lon]);
}
    
    // Update popup
    window.vesselMarkers[mmsi].bindPopup(`
      <b>${vessel.name}</b><br>
      MMSI: ${mmsi}<br>
      Lat: ${lat}<br>
      Lon: ${lon}
    `);

    // Track storage
    if (!window.vesselTracks[mmsi]) {
      window.vesselTracks[mmsi] = [];
    }

    window.vesselTracks[mmsi].push([lat, lon]);

    // Keep last ~24h (limit points)
    if (window.vesselTracks[mmsi].length > 2000) {
      window.vesselTracks[mmsi].shift();
    }

    // Draw/update track line
    if (window.vesselTracks[mmsi].line) {
      map.removeLayer(window.vesselTracks[mmsi].line);
    }

    window.vesselTracks[mmsi].line = L.polyline(
      window.vesselTracks[mmsi],
      { color: vessel.color, weight: 2 }
    ).addTo(map);

    if (!window.visibleVessels[mmsi]) return;

  } catch (e) {
    console.error("AIS error:", e);
  }
};


  socket.onerror = (err) => {
    console.error("AISstream error:", err);
  };

  socket.onclose = () => {
    console.warn("AIS connection closed");
  };
}

startAISStream();

// Auto-refresh every 40 seconds
setInterval(loadStations, 40000);
</script>

</body>
</html>
