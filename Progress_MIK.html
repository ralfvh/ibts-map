<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MIK Progress</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

#map {
    height: 100vh;
}

const valueLayer = L.layerGroup().addTo(map);

.value-label {
    font-size: 14px;
    font-weight: bold;
    color: black;
    text-align: center;
    background: transparent;
    padding: 2px 4px;
    border-radius: 3px;
}

</style>
</head>

<body>

<div id="map"></div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/1RGcPPXybYzVNQCwyK2_uOaodrWjwalecxCsRLqBiuE8/export?format=csv";

const map = L.map('map', {
    zoomControl: false
}).setView([56.5, 3.0], 6);

function getFontSize() {

  const zoom = map.getZoom();

  if (zoom <= 5) return 8;
  if (zoom <= 6) return 10;
  if (zoom <= 7) return 12;
  if (zoom <= 8) return 14;

  return 16;
}

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 12,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

const fishControl = L.control({
  position: "topleft"
});

fishControl.onAdd = function () {

  const div = L.DomUtil.create(
  "div",
  "leaflet-bar leaflet-control"
);

 div.innerHTML = `
  <a
    href="https://ralfvh.github.io/ibts-map/Progress_map.html"
    target="_blank"
    title="Fish map"
    style="
      width:auto;
      min-width:60px;
      padding:0 10px;
      text-decoration:none;
      font-weight:bold;
      display:block;
      line-height:30px;
      text-align:center;
      color:black;
      background:white;
    ">
    🐟 Fish
  </a>
`;

  L.DomEvent.disableClickPropagation(div);

  return div;
};

fishControl.addTo(map);

function drawICESGrid() {

  const latStart = 48;
  const latEnd = 62;
  const lonStart = -4;
  const lonEnd = 12;

  for (let lat = latStart; lat < latEnd; lat += 0.5) {

    for (let lon = lonStart; lon < lonEnd; lon += 1) {

      L.rectangle(
        [
          [lat, lon],
          [lat + 0.5, lon + 1]
        ],
        {
          color: '#888',
          weight: 0.5,
          fill: false
        }
      ).addTo(map);
    }
  }
}

drawICESGrid();

function getRectangleCentre(rectangle) {

  rectangle = rectangle.trim().toUpperCase();

  const match =
    rectangle.match(/^(\d+)([A-Z])(\d+)$/);

  if (!match) return null;

  const row = parseInt(match[1]);
  const letter = match[2];
  const quadrant = parseInt(match[3]);

  // Latitude
  const lat =
    36 + (0.5 * row) - 0.25;

  // Longitude lookup
  const lonBases = {
    A: -50,
    B: -40,
    C: -30,
    D: -20,
    E: -10,
    F: 0,
    G: 10,
    H: 20,
    J: 30
  };

  const baseLon = lonBases[letter];

  if (baseLon === undefined) return null;

  const lon =
    baseLon + quadrant + 0.5;

  return {
    lat: lat,
    lon: lon
  };
}

   
      
async function loadICESValues() {

  try {

    const response = await fetch(
      csvUrl + "&_=" + Date.now()
    );

    const text = await response.text();

    const rows = text.trim()
      .split("\n")
      .map(r => r.split(","));

    const data = rows.slice(1);

data.forEach(row => {

  const rectangle = row[13]?.trim(); // column N
  const value = row[14]?.trim();     // column O
  // use row[15] if value is actually in column P

  if (!rectangle || !value) return;

const centre = getRectangleCentre(rectangle);

console.log(rectangle, centre);

if (!centre) return;

const textColor =
  parseFloat(value) <= 2 ? "red" : "black";

L.marker(
  [centre.lat, centre.lon],
  {
    icon: L.divIcon({
      className: "value-label",
      html: `
        <span style="
          color:${textColor};
          font-weight:bold;
          font-size:${getFontSize()}px;
        ">
          ${value}
        </span>
      `
    })
  }
).addTo(valueLayer);


  } catch(err) {

    console.error(err);

  }

}
loadICESValues();
    
map.on("zoomend", () => {

  valueLayer.clearLayers();

});

</script>

</body>
</html>
